name: Keep-Alive Ping

on:
  schedule:
    - cron: '*/10 * * * *'  # 每10分钟 ping 一次，防止 Render 免费服务 15 分钟无流量后休眠
  workflow_dispatch: {}     # 支持在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthcheck
        run: |
          code="000"
          for i in 1 2; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 \
              https://march7-telegram-bot.onrender.com/healthcheck)
            echo "ping #$i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error::ping 失败（两次尝试均非 200）"
            exit 1
          fi
