version: '3.8'

services:
  march7-bot:
    build: .
    container_name: march7-telegram-bot
    env_file:
      - .env  # 如果有 .env 文件
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - QQ_BOT_ENABLED=${QQ_BOT_ENABLED:-false}
      - QQ_BOT_API_URL=${QQ_BOT_API_URL}
      - QQ_BOT_SECRET=${QQ_BOT_SECRET}
      - QQ_BOT_PORT=${QQ_BOT_PORT:-8080}
    volumes:
      - ./march7_bot.db:/app/march7_bot.db  # 持久化数据库
      - ./qq_bot/data:/app/qq_bot/data  # 如果使用 QQ Bot
    ports:
      - "8080:8080"  # 如果 QQ Bot 启用
    restart: unless-stopped