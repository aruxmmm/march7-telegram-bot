version: '3.8'

services:
  march7-bot:
    build: .
    container_name: march7-telegram-bot
    env_file:
      - .env  # 如果有 .env 文件
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
    volumes:
      - ./march7_bot.db:/app/march7_bot.db  # 持久化数据库
    ports:
      - "8080:8080"
    restart: unless-stopped